name: build-and-push-api

on:
  push:
    branches: [main]
    paths:
      - 'app/**'

jobs:
  docker-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/aleeexx5/devops-playground:latest
            ghcr.io/aleeexx5/devops-playground:${{ github.sha }}
      - name: Update image tag in values-fastapi.yaml
        run: |
          sed -i "s/tag: .*/tag: ${{ github.sha }}/" helm/charts/k8s-app/values-fastapi.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add helm/charts/k8s-app/values-fastapi.yaml
          git commit -m "ci: update image tag to ${{ github.sha }}"
          git push