apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aleeexx5/devops-playground
    targetRevision: HEAD
    path: helm/charts/k8s-app
    helm:
      valueFiles:
        - values-fastapi.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true